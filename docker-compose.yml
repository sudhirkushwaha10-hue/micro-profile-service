services:
  profile-service:
    image: sudhirera/profile-service:1.0
    container_name: profile-service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@profile-db:5432/profile_db
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      profile-db:
        condition: service_healthy
    restart: unless-stopped

  profile-db:
    image: postgres:16-alpine
    container_name: profile-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: profile_db
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d profile_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  profile-db-data: